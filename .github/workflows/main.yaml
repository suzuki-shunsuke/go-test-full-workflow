---
name: test
on: pull_request
permissions: {}
jobs:
  status-check:
    runs-on: ubuntu-26.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - test
    steps:
      - run: exit 1
  test:
    uses: $/.github/workflows/test.yaml
    with:
      aqua_version: v2.64.0
    permissions:
      contents: read
      pull-requests: write
      id-token: write
