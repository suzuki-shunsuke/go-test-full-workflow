---
name: test
on:
  workflow_call:
    inputs:
      aqua_version:
        required: true
        type: string
      go-version-file:
        required: false
        default: go.mod
        type: string
      golangci-lint-timeout:
        required: false
        type: string
      gomodule_artifact_name:
        # The name of the artifact created by suzuki-shunsuke/download-go-module-action in the caller workflow.
        # If this is set, go-test-workflow doesn't download Go modules and uses the artifact instead.
        # The artifact must include go-licenses (aqua_packages: go-licenses).
        required: false
        type: string
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
permissions: {}
jobs:
  go:
    uses: suzuki-shunsuke/go-test-workflow/.github/workflows/test.yaml@a1895416ec8ae2c4655a2879a06658d500e74462 # ci/download-go-module-action
    with:
      aqua_version: ${{inputs.aqua_version}}
      go-version-file: ${{inputs.go-version-file}}
      golangci-lint-timeout: ${{inputs.golangci-lint-timeout}}
      gomodule_artifact_name: ${{inputs.gomodule_artifact_name}}
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      pull-requests: write
      contents: read
      id-token: write

  test:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@51ece8dcaabff59820bfb2053c56e3cb281cf7b2 # v0.0.1
    with:
      aqua_version: ${{inputs.aqua_version}}
    permissions:
      pull-requests: read
      contents: read
